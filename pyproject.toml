[project]
name = "chat-safety-classifier"
version = "0.1.0"
description = "Conversation-aware classifier for personal-information and off-platform contact sharing in chat"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "faker>=30",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# Rules + PII-tagger baseline (Step 5).
baselines = [
    "presidio-analyzer>=2.2",
    "gliner>=0.2",
]
# Fine-tuning runs in Colab (src/modeling/notebooks/train_bert.ipynb), which ships these.
# Only needed to run the notebook elsewhere: `pip install -e .[train]`.
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The modeling package lives at src/modeling and is imported as `modeling`.
# Serving code (later milestones) gets its own sibling directory under src/.
[tool.hatch.build.targets.wheel]
packages = ["src/modeling"]

[tool.pytest.ini_options]
testpaths = ["src/modeling/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
